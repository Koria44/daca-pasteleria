{% if messages %}
<div class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 max-w-md w-full px-4 pointer-events-none" id="django-messages">
  {% for message in messages %}
  <div 
    x-data="{ show: true }" 
    x-show="show" 
    x-init="setTimeout(() => show = false, 5000)"
    x-transition:enter="transform ease-out duration-300"
    x-transition:enter-start="translate-y-4 opacity-0 scale-95"
    x-transition:enter-end="translate-y-0 opacity-100 scale-100"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100 scale-100"
    x-transition:leave-end="opacity-0 scale-95"
    class="pointer-events-auto p-4 rounded-2xl shadow-warm border flex items-start justify-between gap-3 bg-white/95 backdrop-blur-md {{ message.tags }}"
  >
    <div class="flex items-center gap-3">
      <span class="text-heart text-xl flex-shrink-0">
        <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </span>
      <p class="text-sm font-medium text-cocoa leading-snug">{{ message }}</p>
    </div>
    <button @click="show = false" class="text-cocoa/50 hover:text-cocoa transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  </div>
  {% endfor %}
</div>
{% endif %}
