<div 
  x-data="{ open: false }" 
  @open-cart.window="open = true"
  @close-cart.window="open = false"
  @keydown.escape.window="open = false"
  class="relative z-50"
  aria-labelledby="slide-over-title" 
  role="dialog" 
  aria-modal="true"
>
  <!-- Background backdrop -->
  <div 
    x-show="open" 
    x-transition:enter="ease-in-out duration-400"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="ease-in-out duration-300"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    @click="open = false"
    class="fixed inset-0 bg-cocoa/40 backdrop-blur-sm transition-opacity"
    style="display: none;"
  ></div>

  <!-- Slide-over panel -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute inset-0 overflow-hidden">
      <div class="pointer-events-none fixed inset-y-0 right-0 flex max-w-full pl-10">
        <div 
          x-show="open" 
          x-transition:enter="transform transition ease-in-out duration-400 sm:duration-500"
          x-transition:enter-start="translate-x-full"
          x-transition:enter-end="translate-x-0"
          x-transition:leave="transform transition ease-in-out duration-300 sm:duration-400"
          x-transition:leave-start="translate-x-0"
          x-transition:leave-end="translate-x-full"
          class="pointer-events-auto w-screen max-w-md bg-cream shadow-2xl flex flex-col border-l border-kraft/20"
          id="cart-drawer-container"
          style="display: none;"
        >
          {% include 'cart/partials/_cart_drawer_content.html' %}
        </div>
      </div>
    </div>
  </div>
</div>
