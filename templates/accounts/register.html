{% extends 'base.html' %}

{% block title %}Crear Cuenta · Daca Pastelería La Florida{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
  <div class="bg-white rounded-3xl p-8 sm:p-10 shadow-warm border border-kraft/20 space-y-6">
    
    <div class="text-center space-y-2">
      <div class="w-16 h-16 rounded-full bg-cream-100 border border-kraft/30 flex items-center justify-center text-heart mx-auto mb-3">
        <svg class="w-8 h-8 fill-current" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>
      <h1 class="font-serif text-3xl font-bold text-cocoa">Únete a Daca</h1>
      <p class="text-xs text-cocoa/70">Crea tu cuenta para guardar tus direcciones, historial de compras y personalizar tus tortas.</p>
    </div>

    <form method="post" action="{% url 'accounts:register' %}" class="space-y-4">
      {% csrf_token %}

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-cocoa mb-1">Nombre</label>
          <input type="text" name="first_name" required placeholder="Camila" class="w-full rounded-2xl border-kraft/30 text-sm py-2 px-3.5 bg-cream-50">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-cocoa mb-1">Apellido</label>
          <input type="text" name="last_name" required placeholder="Silva" class="w-full rounded-2xl border-kraft/30 text-sm py-2 px-3.5 bg-cream-50">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-cocoa mb-1">Usuario *</label>
        <input type="text" name="username" required placeholder="camila_silva" class="w-full rounded-2xl border-kraft/30 text-sm py-2 px-3.5 bg-cream-50">
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-cocoa mb-1">Correo Electrónico *</label>
        <input type="email" name="email" required placeholder="camila@ejemplo.cl" class="w-full rounded-2xl border-kraft/30 text-sm py-2 px-3.5 bg-cream-50">
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-cocoa mb-1">Teléfono / WhatsApp</label>
        <input type="tel" name="phone" placeholder="+56 9 8765 4321" class="w-full rounded-2xl border-kraft/30 text-sm py-2 px-3.5 bg-cream-50">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-cocoa mb-1">Contraseña *</label>
          <input type="password" name="password" required placeholder="••••••••" class="w-full rounded-2xl border-kraft/30 text-sm py-2 px-3.5 bg-cream-50">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-cocoa mb-1">Confirmar *</label>
          <input type="password" name="password_confirm" required placeholder="••••••••" class="w-full rounded-2xl border-kraft/30 text-sm py-2 px-3.5 bg-cream-50">
        </div>
      </div>

      <div class="pt-2">
        <button type="submit" class="btn-primary w-full py-3.5 text-sm font-bold shadow-heart">
          Crear mi Cuenta
        </button>
      </div>
    </form>

    <div class="text-center pt-4 border-t border-kraft/15 text-xs text-cocoa/70">
      ¿Ya tienes una cuenta? <a href="{% url 'accounts:login' %}" class="text-heart font-bold hover:underline">Inicia sesión</a>
    </div>

  </div>
</div>
{% endblock %}
